name: ProofPack CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Benchmark
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build All Monorepo Workspaces
        run: npm run build

      - name: Run Cryptographic & Batcher Unit Tests
        run: npm test

      - name: Run Smart Contract Hardhat Tests
        run: npm run test:contracts

      - name: Execute Gas & Compression Benchmark Harness
        run: npm run benchmark
